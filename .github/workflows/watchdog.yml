name: ESP32 Watchdog

on:
  schedule:
    - cron: "*/5 * * * *" # כל 5 דקות (המרווח המינימלי הסביר ב-GitHub Actions)
  workflow_dispatch: {} # מאפשר הרצה ידנית מטאב Actions לצורך בדיקה

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchdog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node check.js
        env:
          FIREBASE_HOST: ${{ secrets.FIREBASE_HOST }}
          DEVICE_ID: esp32_home
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          STALE_THRESHOLD_SEC: "180"
